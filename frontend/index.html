<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>DFCCI Threshold</title>
    <!--
      Theme bootstrap — MUST stay inline and MUST stay before any stylesheet.
      React applies the theme in an effect, which runs after first paint, so
      without this every load flashes the default theme before settling. With a
      "system" mode that flash is a full light/dark inversion.

      Keep this in sync with src/context/ThemeContext.jsx. It is deliberately
      dependency-free and wrapped in try/catch: a throw here would block the
      page, and localStorage throws outright in Safari private mode.
    -->
    <script>
      (function () {
        try {
          var LEGACY = {
            light: 'azure', dark: 'azure', mint: 'aurora', aurora: 'aurora',
            sepia: 'ember', sunset: 'ember', lavender: 'dusk', dusk: 'dusk',
            peony: 'rose', claret: 'rose', glacier: 'tide', abyss: 'tide',
            obsidian: 'mono', nord: 'nord', dracula: 'dracula',
            vaporwave: 'vapor', cyberpunk: 'neon', espresso: 'roast',
            beacon: 'signal', slate: 'slate', cottagecore: 'sage'
          };
          var DARK_LEGACY = {
            dark: 1, aurora: 1, dusk: 1, sunset: 1, obsidian: 1, nord: 1,
            dracula: 1, vaporwave: 1, cyberpunk: 1, abyss: 1, espresso: 1,
            claret: 1, beacon: 1
          };

          var FAMILIES = {
            azure: 1, aurora: 1, ember: 1, dusk: 1, rose: 1, tide: 1, mono: 1,
            nord: 1, dracula: 1, vapor: 1, neon: 1, roast: 1, signal: 1,
            slate: 1, sage: 1
          };

          var stored = localStorage.getItem('theme');
          var mode = localStorage.getItem('themeMode');

          // Has the user actually chosen a mode? 'themeModeLocked' is the
          // modern signal, but it is new — and before shuffle existed the app
          // wrote 'themeMode' on every mount, so for everyone who was already
          // using the site an explicit light/dark there is the ONLY evidence
          // they ever gave. Without this clause a returning user who picked
          // dark for photosensitivity gets coin-flipped into white.
          // 'system' is genuinely ambiguous — it was also the default — so it
          // does not count as a choice.
          var modeLocked = localStorage.getItem('themeModeLocked') === '1'
            || mode === 'light' || mode === 'dark';

          // Note the order: a key that is BOTH a legacy theme and a family name
          // (aurora, dusk, nord, dracula, slate) is treated as legacy only while
          // themeMode is absent — i.e. exactly once, on the first load after the
          // upgrade. After that themeMode always exists and wins.
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            mode = LEGACY[stored]
              ? (DARK_LEGACY[stored] ? 'dark' : 'light')
              : 'system';
          }

          // Unknown values must not reach data-theme, or the page renders with
          // no seed colours at all until React mounts.
          var family = FAMILIES[stored] ? stored : (LEGACY[stored] || 'azure');
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;

          // Shuffle: a fresh look on every visit, opt-in from the theme panel.
          //
          // The roll happens HERE and nowhere else. ThemeContext reads the result
          // back off the element rather than rolling again — two rolls would mean
          // the palette visibly changes the moment React mounts.
          //
          // It deliberately never writes 'theme'. A saved pick has to survive
          // shuffle being switched on and off again, so the rolled family lives
          // in its own key.
          if (localStorage.getItem('themeShuffle') === '1') {
            // A VISIT, not a page load. src/api.js sends an expired session to
            // /login with window.location.href, OAuth bounces through a
            // redirect, and people reload forms — re-rolling on any of those
            // repaints the site out from under someone mid-task. So the roll is
            // remembered and reused for anything inside the gap.
            //
            // The timestamp is refreshed on EVERY load, so the gap measures
            // time away rather than time since the roll: browse all afternoon
            // and the theme holds; come back tomorrow and it is new.
            var GAP = 30 * 60 * 1000;
            var now = Date.now();
            var at = parseInt(localStorage.getItem('themeRollAt'), 10);
            var roll = localStorage.getItem('themeRoll');
            var rollMode = localStorage.getItem('themeRollMode');
            var sameVisit = roll && FAMILIES[roll] && at && (now - at) < GAP;

            if (!sameVisit) {
              // Excluding the previous roll: back-to-back repeats read as
              // 'the shuffle is broken' far more than they read as chance.
              var pool = [];
              for (var k in FAMILIES) { if (k !== roll) pool.push(k); }
              if (!pool.length) pool = Object.keys(FAMILIES);
              roll = pool[Math.floor(Math.random() * pool.length)];
              rollMode = Math.random() < 0.5 ? 'dark' : 'light';
              localStorage.setItem('themeRoll', roll);
              localStorage.setItem('themeRollMode', rollMode);
            }
            localStorage.setItem('themeRollAt', String(now));

            family = roll;
            // Mode rides along only until the user states a preference.
            if (!modeLocked) resolved = rollMode === 'dark' ? 'dark' : 'light';
          }

          var el = document.documentElement;
          el.className = resolved;
          el.setAttribute('data-theme', family);
          el.style.colorScheme = resolved;
        } catch (e) {
          // Without colorScheme here, a dark-OS device paints the light
          // fallback while its native scrollbars and date pickers stay dark.
          document.documentElement.className = 'light';
          document.documentElement.setAttribute('data-theme', 'azure');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <!-- Standard Google Identity Services script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[SW] Registered:', reg.scope))
            .catch((err) => console.error('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
